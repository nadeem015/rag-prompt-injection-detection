name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit, integration and Streamlit AppTest
        run: python -m pytest -q
      - name: Launch the Streamlit app and check it serves
        run: |
          streamlit run app.py --server.headless true --server.port 8501 &
          for i in $(seq 1 30); do curl -sf http://localhost:8501/_stcore/health && exit 0; sleep 2; done
          exit 1
